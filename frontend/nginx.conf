# nginx · MediTec-ITS
# Sirve el sitio estático de Astro y proxea la API al servicio backend,
# de modo que el navegador siempre habla con un solo origen.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Las redirecciones se emiten relativas: nginx se cree en el puerto 80
  # (por dentro del contenedor) y una URL absoluta perdería el puerto
  # externo (4321/8080) al redirigir rutas sin barra final.
  absolute_redirect off;

  # La API se proxea al servicio "backend" de docker compose
  # (el ^~ evita que las reglas de caché de abajo capturen rutas /api)
  location ^~ /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Sitio estático (Astro genera /seccion/index.html por cada página)
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Los HTML no se cachean: cada despliegue se ve al instante en el navegador
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  # Los assets traen hash en el nombre: se cachean a gusto
  location ~* \.(js|css|png|jpe?g|svg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
